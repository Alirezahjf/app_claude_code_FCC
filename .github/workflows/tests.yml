name: tests

on:
  push:
    branches: ["**"]
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen
  FCC_E2E: "0"

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate icon assets (needs Pillow)
        run: python tools/make_icons.py

      - name: Qt import sanity check
        run: python -c "from PySide6.QtWidgets import QApplication; print('qt import ok')"

      - name: Run the test suite
        run: python -m pytest -q -rf

      - name: Packaging dry run
        run: python tools/build_windows.py --check
